      <h1 class="article-title">IWA&rsquo;s Women Extraordinaire</h1>
      <div class="article-meta">February 22, 2026 &bull; By Judy Carmack Bross</div>
    </div>

    <div class="article-body">
      <p>Hearing who IWA will honor as Woman Extraordinaire at its annual luncheon reveals a woman for Chicago to celebrate and a jubilant way to learn of profound accomplishments.</p>

      <p>On March 4 at the Ivy Room, The International Women Associates (IWA), noted for its popular luncheon which blends culture, camaraderie and cuisine, has for the first time selected more than one winner. Three Chicago powerhouses: their careers advance the welfare of women and children and inspire action by others.</p>

      <figure>
        <img src="barbara-gaines.jpg" alt="Barbara Gaines, Founder and former Artistic Director of Chicago Shakespeare Theater.">
        <figcaption>Barbara Gaines, Founder and former Artistic Director, Chicago Shakespeare Theater.</figcaption>
      </figure>

      <p>The non-profit cultural and educational organization will be supporting International Women&rsquo;s Day as it salutes Barbara Gaines, founder and former artistic director, Chicago Shakespeare Theater; Irma Su&aacute;rez Ruiz, Artistic Director, Ensemble Espa&ntilde;ol; and Josephine Lee, President and Artistic Director, Uniting Voices (formerly Chicago Children&rsquo;s Choir).</p>

      <p>The three women were chosen by IWA for their contributions to building international artistic excellence in Chicago and advancing the arts around the world for women and children.</p>

      <blockquote>&ldquo;Because our organization is dedicated to education and cross-cultural exchange, we felt that each of these nominees should be honored this year for their accomplishments and contributions to Chicago,&rdquo; IWA President Ying Hirsh said. &ldquo;An added plus is that they each share many characteristics with IWA members. They&rsquo;re perseverant, globally-minded, travelers, transformers of lives, teachers and dreamers who made their dreams come true.&rdquo;</blockquote>

      <figure>
        <img src="josephine-lee.png" alt="Josephine Lee, President and Artistic Director of Uniting Voices.">
        <figcaption>Josephine Lee, President and Artistic Director of Uniting Voices.</figcaption>
      </figure>

      <p>We spoke recently with Irma Su&aacute;rez Ruiz and Josephine Lee, each acknowledging how much the award means to them.</p>

      <p>Lee told us: &ldquo;It is an honor to be recognized by a group with a global platform and reach that encourages stories of resilience, hope and courage. For Uniting Voices, music is a unifying force making us part of a global network as well.&rdquo;</p>

      <p>The 3000 plus youth singers who perform at venues from classical concert stages to Lollapalooza will embark on a 15-day tour of China in March shortly after the IWA luncheon, collaborating with local partners there.</p>

      <p>&ldquo;Our youth are not just activating notes on a page, they are also learning about culture, excellence, leadership, and teamwork. We provide for them a portal to the world,&rdquo; Lee said.</p>

      <p>We asked Lee, who was born in Chicago, about the current K-Pop world phenomenon.</p>

      <p>&ldquo;As a child in the 1980s there really wasn&rsquo;t that much excitement about Korea even with the Olympics there at the end of that decade. Mitchell Owens, one of my former students whom I have known since he was eight, is a top K-Pop producer whose work has received over 100 million streams. K-Pop is letting people know what a beautiful country Korea is. And delighted that kimchi has become such a popular dish.&rdquo;</p>

      <figure>
        <img src="irma-suarez-ruiz.jpg" alt="Irma Su&aacute;rez Ruiz, Artistic Director for the Ensemble Espa&ntilde;ol.">
        <figcaption>Irma Su&aacute;rez Ruiz, Artistic Director for the Ensemble Espa&ntilde;ol.</figcaption>
      </figure>

      <p>Ruiz told us: &ldquo;My first reaction to hearing about the award was: &lsquo;what, me?&rsquo; It often takes someone else to recognize you. I would just say it is part of my job.&rdquo;</p>

      <p>Ruiz is Artistic Director for the Ensemble Espa&ntilde;ol at Northeastern Illinois University, with choreographer, educator, and costume designer as facets of her work. Born in Chicago, she has Mexican and Puerto Rican ancestry.</p>

      <p>&ldquo;I love seeing my vision being created, it is a process which begins in my mind. Then there are months of rehearsals, making fabric and color selections, and finally seeing it all come together,&rdquo; she said.</p>

      <p>Ensemble Espa&ntilde;ol will offer a summer festival of performers in June.</p>

      <p>Ruiz explained that the company does dances from Spain only including classical, regional and fiery Flamenco often with castanets.</p>

      <p>&ldquo;What does Spanish dancing have in common? You see passion in all. It is dramatic at the same time fun and athletic. Emotions show on the dancers faces,&rdquo; she said.</p>

      <figure>
        <img src="ying-hirsh.jpg" alt="Ying Hirsh, IWA President.">
        <figcaption>Ying Hirsh, IWA President.</figcaption>
      </figure>

      <p>IWA President Ying Hirsh told us more about her organization, including its founding by one of Chicago&rsquo;s most captivating and committed women, Doe Thornburg.</p>

      <p>&ldquo;International Women Associates is an organization of women from over 50 countries in the Chicago area and beyond. We welcome both foreign-born women and those who have lived abroad or have international connections. Since our founding in 1978 by Doe, we continue to celebrate our diversity through friendship, community service, philanthropy, and cross-cultural exchange. Doe&rsquo;s vision was to create an organization that promotes global understanding by seeing the &lsquo;sacred&rsquo; in everyone. It is this vision that attracts new members to IWA and keeps the organization vibrant.&rdquo;</p>

      <p>The public is invited to the 2026 IWA Woman Extraordinaire luncheon and program on March 4th at the Ivy Room in Chicago, while tickets are available. We look forward to sharing photos of the event and winners&rsquo; remarks in a future issue of Classic Chicago.</p>

      <p>For further information, including a list of previous Woman Extraordinaire awardees, visit the IWA website at <a href="https://iwachicago.org">iwachicago.org</a> or contact IWA at <a href="mailto:iwa@iwachicago.org">iwa@iwachicago.org</a> or 312.263.1421.</p>
