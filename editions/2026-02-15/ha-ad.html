<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heritage Auctions – Prints & Multiples</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #e8e8e8;
      font-family: Georgia, "Times New Roman", serif;
    }

    .ad-container {
      position: relative;
      width: 300px;
      height: 600px;
      overflow: hidden;
      background: #000;
    }

    /* The artwork image fills the entire container, clipped to the lower-right triangle */
    .ad-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      clip-path: polygon(0% 100%, 100% 38%, 100% 100%);
      z-index: 1;
    }

    /* Thin diagonal line effect */
    .ad-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
      /* A subtle line along the diagonal — achieved via a thin gradient */
      background: linear-gradient(
        to bottom right,
        transparent calc(50% - 0.5px),
        rgba(255,255,255,0.15) 50%,
        transparent calc(50% + 0.5px)
      );
      clip-path: polygon(0% 100%, 100% 38%, 100% 39%, 0% 101%);
    }

    /* Heritage logo — right-aligned at top */
    .ha-logo {
      position: absolute;
      top: 18px;
      right: 18px;
      text-align: right;
      z-index: 3;
    }

    .ha-logo .heritage {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1;
    }

    .ha-logo .heritage sup {
      font-size: 9px;
      vertical-align: super;
      letter-spacing: 0;
    }

    .ha-logo .auctions {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-weight: normal;
      color: #fff;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 1px;
      line-height: 1.3;
    }

    /* Email — right-aligned below logo */
    .ha-email {
      position: absolute;
      top: 78px;
      right: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      color: #fff;
      letter-spacing: 0.01em;
      z-index: 3;
      text-align: right;
    }

    /* Main heading — centered in the upper portion */
    .ha-heading {
      position: absolute;
      top: 145px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      font-weight: normal;
      color: #fff;
      line-height: 1.2;
      z-index: 3;
    }

    /* Artist info — positioned in the lower-left of the black triangle */
    .ha-artist {
      position: absolute;
      bottom: 175px;
      left: 24px;
      z-index: 3;
      color: #fff;
      text-align: left;
    }

    .ha-artist .artist-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: normal;
      color: #fff;
      margin-bottom: 2px;
      line-height: 1.4;
    }

    .ha-artist .artwork-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-style: italic;
      font-weight: normal;
      color: #fff;
      margin-bottom: 2px;
      line-height: 1.4;
    }

    .ha-artist .artwork-year {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: normal;
      color: #fff;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="ad-container">
    <!-- Artwork image — clipped to bottom-right triangle -->
    <img src="ha-ad.jpg" alt="Faith Ringgold, Tar Beach 2, 1990" class="ad-image">

    <!-- Heritage Auctions logo — top right -->
    <div class="ha-logo">
      <div class="heritage">Heritage<sup>&reg;</sup></div>
      <div class="auctions">Auctions</div>
    </div>

    <!-- Email — below logo, right-aligned -->
    <div class="ha-email">BeckyL@HA.com</div>

    <!-- Main heading — centered -->
    <div class="ha-heading">Prints &amp;<br>Multiples</div>

    <!-- Artist info — lower-left of black triangle -->
    <div class="ha-artist">
      <div class="artist-name">Faith Ringgold</div>
      <div class="artwork-title">Tar Beach 2</div>
      <div class="artwork-year">1990</div>
    </div>
  </div>

</body>
</html>
