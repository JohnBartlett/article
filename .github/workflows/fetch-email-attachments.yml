name: Fetch Email Attachments

on:
  schedule:
    # Hourly at :15 (UTC) -- offset from the dashboard refresh (:37) and the
    # Claude cloud check-emails routine (:39) so the three don't collide.
    - cron: '15 * * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev2
        uses: actions/checkout@v4
        with:
          ref: dev2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Write Gmail OAuth keys
        run: echo '${{ secrets.GMAIL_OAUTH_KEYS }}' > /tmp/gmail-oauth-keys.json

      - name: Write Gmail credentials
        run: echo '${{ secrets.GMAIL_CREDENTIALS }}' > /tmp/gmail-credentials.json

      - name: Stage pending attachments
        env:
          GMAIL_OAUTH_KEYS_PATH: /tmp/gmail-oauth-keys.json
          GMAIL_CREDENTIALS_PATH: /tmp/gmail-credentials.json
        run: python3 tools/fetch_pending_attachments.py --days 14

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _attachment-staging/
          if git diff --cached --quiet; then
            echo "No new attachments — skipping commit"
          else
            git commit -m "Stage new email attachments [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin dev2
            git push origin dev2
          fi
