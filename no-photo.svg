<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f5f0eb"/>
  <!-- subtle border -->
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#d4c9bc" stroke-width="1"/>
  <!-- inner frame -->
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="#d4c9bc" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- CLASSIC CHICAGO in wide-spaced caps -->
  <text x="400" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" letter-spacing="12" fill="#2c2c2c" text-anchor="middle">CLASSIC CHICAGO</text>

  <!-- decorative rule left -->
  <line x1="180" y1="232" x2="310" y2="232" stroke="#2c2c2c" stroke-width="0.75"/>
  <!-- magazine italic -->
  <text x="400" y="243" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" letter-spacing="4" fill="#2c2c2c" text-anchor="middle">magazine</text>
  <!-- decorative rule right -->
  <line x1="490" y1="232" x2="620" y2="232" stroke="#2c2c2c" stroke-width="0.75"/>

  <!-- spacer then "Photo not available" -->
  <text x="400" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#9a8f84" text-anchor="middle">PHOTO NOT AVAILABLE</text>
</svg>
